<div class="screen story-screen dark-bg">
  <div class="story-screen__content">
    <!-- ヘッダー（AUTO/SKIPボタン） -->
    <div class="story-screen__header">
      <button class="story-screen__auto-btn ui-btn ui-btn--outline">
        AUTO
      </button>
      <button class="story-screen__skip-btn ui-btn ui-btn--outline">
        SKIP
      </button>
    </div>

    <!-- 立ち絵エリア -->
    <div class="story-screen__character-area">
      <div class="story-screen__character-placeholder">
        <span>立ち絵枠</span>
      </div>
    </div>

    <!-- テキストウィンドウ -->
    <div class="story-screen__text-window">
      <p class="story-screen__speaker-name"></p>
      <div class="story-screen__text-divider"></div>
      <p class="story-screen__message"></p>
      <span class="story-screen__next-indicator">&#9660;</span>
    </div>
  </div>
</div>
