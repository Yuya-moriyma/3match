<div class="tutorial-modal__overlay">
  <div class="tutorial-modal__dialog ui-panel ui-panel--parchment">
    <h2 class="tutorial-modal__title">{{title}}</h2>
    <div class="tutorial-modal__divider"></div>
    <div class="tutorial-modal__body">
      <p class="tutorial-modal__text"></p>
      <div class="tutorial-modal__indicators"></div>
    </div>
    <div class="tutorial-modal__divider"></div>
    <div class="tutorial-modal__footer">
      <button class="tutorial-modal__prev ui-btn ui-btn--outline">
        <span class="material-symbols-outlined">arrow_back</span>
        <span>前へ</span>
      </button>
      <button class="tutorial-modal__close ui-btn ui-btn--accent">閉じる</button>
      <button class="tutorial-modal__next ui-btn ui-btn--outline">
        <span>次へ</span>
        <span class="material-symbols-outlined">arrow_forward</span>
      </button>
    </div>
  </div>
</div>
